<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yo'naltirilmoqda…</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0f0e;color:#e8ede9;font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;text-align:center}
  .spinner{width:28px;height:28px;border:2px solid #222824;
  border-top-color:#39ff7a;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2{font-size:15px;color:#39ff7a;margin-bottom:6px;font-weight:600;letter-spacing:0.04em}
  p{font-size:11px;color:#5a6b5e;margin:3px 0;letter-spacing:0.06em}
  .manual{margin-top:24px;font-size:11px;color:#5a6b5e}
  .manual a{color:#39ff7a;text-decoration:none}
</style>
</head>
<body>
<div class="spinner"></div>
<h2>Yo'naltirilmoqda…</h2>
<p id="st">Qurilma aniqlanmoqda</p>
<div class="manual"><a href="#" id="ml">Avtomatik ochilmasa bosing</a></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var ios=p.get('ios');
  var android=p.get('android');
  var fallback=p.get('url')||location.href;
  var cbBase=p.get('cb');   // manager base URL
  var linkId=p.get('id');   // link ID for click tracking

  document.getElementById('ml').href=fallback;

  // --- Click tracking ping ---
  if(cbBase && linkId){
    try{
      // Use no-cors image ping — works cross-origin, no CORS issue
      var img=new Image();
      img.src=cbBase+'?click='+encodeURIComponent(linkId)+'&t='+Date.now();
    }catch(e){}
  }

  var ua=navigator.userAgent;
  var isIOS=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  var isAndroid=/Android/.test(ua);
  var scheme=null;

  if(isIOS&&ios){
    scheme=ios;
    document.getElementById('st').textContent='iOS qurilma aniqlandi';
  } else if(isAndroid&&android){
    scheme=android;
    document.getElementById('st').textContent='Android qurilma aniqlandi';
  } else {
    document.getElementById('st').textContent='Desktop \u2014 brauzerga yo\'naltirmoqda';
  }

  if(scheme){
    var t0=Date.now();
    var timer=setTimeout(function(){
      if(Date.now()-t0<2000) window.location.replace(fallback);
    },1500);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden) clearTimeout(timer);
    });
    window.location.href=scheme;
  } else {
    window.location.replace(fallback);
  }
})();
</script>
</body></html>
