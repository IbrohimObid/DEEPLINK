<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yo'naltirilmoqda…</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0f0e;color:#e8ede9;font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;text-align:center}
  .spinner{width:32px;height:32px;border:2px solid #222824;
  border-top-color:#39ff7a;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2{font-size:16px;color:#39ff7a;margin-bottom:8px;font-weight:600;letter-spacing:0.04em}
  p{font-size:11px;color:#5a6b5e;margin:4px 0;letter-spacing:0.06em}
  .manual{margin-top:28px;font-size:11px;color:#5a6b5e}
  .manual a{color:#39ff7a;text-decoration:none}
  .manual a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="spinner"></div>
<h2>Yo'naltirilmoqda…</h2>
<p id="statusText">Qurilma aniqlanmoqda</p>
<div class="manual"><a href="#" id="manualLink">Avtomatik ochilmasa bu yerga bosing</a></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var ios=p.get('ios');
  var android=p.get('android');
  var fallback=p.get('url')||location.href;

  document.getElementById('manualLink').href=fallback;

  var ua=navigator.userAgent;
  var isIOS=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  var isAndroid=/Android/.test(ua);

  var scheme=null;
  if(isIOS&&ios){
    scheme=ios;
    document.getElementById('statusText').textContent='iOS qurilma aniqlandi';
  } else if(isAndroid&&android){
    scheme=android;
    document.getElementById('statusText').textContent='Android qurilma aniqlandi';
  } else {
    document.getElementById('statusText').textContent='Desktop — brauzerga yo\'naltirmoqda';
  }

  if(scheme){
    var t0=Date.now();
    var timer=setTimeout(function(){
      if(Date.now()-t0<2000) window.location.replace(fallback);
    },1500);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden) clearTimeout(timer);
    });
    window.location.href=scheme;
  } else {
    window.location.replace(fallback);
  }
})();
</script>
</body></html>
