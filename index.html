<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepLink Manager — Ajib Studio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0e;--surface:#141716;--border:#222824;--green:#39ff7a;--green-dim:#1a7a3a;--text:#e8ede9;--muted:#5a6b5e;--error:#ff5252;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 80px}
header{text-align:center;margin-bottom:32px;width:100%;max-width:660px}
.logo{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--green);opacity:0.6;margin-bottom:8px}
h1{font-family:var(--mono);font-size:clamp(22px,4vw,34px);font-weight:700}
h1 span{color:var(--green)}
.server-bar{width:100%;max-width:660px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:20px}
.server-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.12em;white-space:nowrap;flex-shrink:0}
.server-bar input{flex:1;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:12px;color:var(--text);min-width:0}
.server-bar input::placeholder{color:var(--muted)}
.btn{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.06em;padding:10px 18px;border-radius:7px;cursor:pointer;border:none;transition:opacity 0.15s}
.btn-primary{background:var(--green);color:#0d0f0e;width:100%;margin-top:4px}
.btn-primary:hover{opacity:0.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;font-size:11px}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.btn-danger{background:transparent;border:1px solid transparent;color:var(--error);font-family:var(--mono);font-size:11px;font-weight:600;padding:8px 12px;border-radius:7px;cursor:pointer;opacity:0.55;transition:opacity 0.15s}
.btn-danger:hover{opacity:1;border-color:var(--error)}
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;width:100%;max-width:660px;margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.12em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
input[type=text],input[type=url]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:12px;padding:10px 13px;outline:none;transition:border-color 0.15s}
input:focus{border-color:var(--green-dim)}
input::placeholder{color:var(--muted)}
.err{font-family:var(--mono);font-size:11px;color:var(--error);margin-top:6px;display:none}
.err.show{display:block}
.add-toggle{width:100%;max-width:660px;background:transparent;border:1px dashed var(--border);border-radius:12px;padding:14px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;letter-spacing:0.06em;margin-bottom:20px;transition:all 0.15s;text-align:center}
.add-toggle:hover{border-color:var(--green-dim);color:var(--green)}
.links-wrap{width:100%;max-width:660px;display:flex;flex-direction:column;gap:10px}
.link-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.lc-info{flex:1;min-width:0}
.lc-name{font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-meta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.07em}
.lc-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.lc-deeplink{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:10px;color:var(--muted);word-break:break-all;line-height:1.5;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s,color 0.15s}
.lc-deeplink:hover{border-color:var(--green-dim);color:var(--green)}
.lc-stats{display:flex;align-items:center;gap:20px;padding-top:10px;border-top:1px solid var(--border)}
.stat-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);line-height:1}
.stat-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;margin-left:5px}
.stat-date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.empty{text-align:center;padding:40px 24px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.06em;border:1px dashed var(--border);border-radius:12px;width:100%;max-width:660px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--green);color:#0d0f0e;font-family:var(--mono);font-size:12px;font-weight:700;padding:10px 20px;border-radius:6px;opacity:0;transition:all 0.2s;pointer-events:none;letter-spacing:0.06em;white-space:nowrap;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:500px){.row2{grid-template-columns:1fr}.lc-actions{flex-wrap:wrap}}
</style>
</head>
<body>

<header>
  <div class="logo">ajib studio</div>
  <h1>Deep<span>Link</span> Manager</h1>
</header>

<div class="server-bar">
  <span class="server-lbl">REDIRECT URL</span>
  <input type="url" id="serverInput" placeholder="https://ibrohimobid.github.io/DEEPLINK/redirect.html" autocomplete="off" spellcheck="false">
  <button class="btn btn-ghost" onclick="saveServer()">Saqlash</button>
</div>

<div class="add-card" id="addCard" style="display:none">
  <div class="row2">
    <div>
      <div class="field-label"><span class="dot"></span> LINK NOMI</div>
      <input type="text" id="inName" placeholder="Masalan: Ajib Studio intro">
    </div>
    <div>
      <div class="field-label"><span class="dot"></span> MAQSAD HAVOLA</div>
      <input type="url" id="inUrl" placeholder="https://youtube.com/watch?v=...">
    </div>
  </div>
  <div id="addErr" class="err"></div>
  <button class="btn btn-primary" onclick="addLink()">+ Qo&#x2019;shish</button>
</div>

<button class="add-toggle" id="addToggle" onclick="toggleAdd()">+ Yangi deep link qo&#x2019;shish</button>

<div class="links-wrap" id="linksWrap"></div>

<div class="toast" id="toast"></div>

<script>
var LS_SERVER = 'dl_server_v3';
var LS_LINKS  = 'dl_links_v3';
var links = [];
var serverUrl = '';
var addOpen = false;

// Storage helpers
function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v !== null ? v : def; } catch(e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(e) {}
}
function lsGetJSON(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}

// Click ping via localStorage
window.addEventListener('storage', function(e) {
  if (e.key === 'dl_click_ping') {
    try { var d = JSON.parse(e.newValue); recordClick(d.id); } catch(ex) {}
  }
});

// Handle ?click= param
(function() {
  var p = new URLSearchParams(location.search);
  var clickId = p.get('click');
  if (clickId) {
    history.replaceState(null, '', location.pathname);
    window._pendingClick = clickId;
  }
})();

function recordClick(id) {
  var idx = -1;
  for (var i = 0; i < links.length; i++) { if (links[i].id === id) { idx = i; break; } }
  if (idx === -1) return;
  links[idx].clicks = (links[idx].clicks || 0) + 1;
  links[idx].lastClick = Date.now();
  saveLinks();
  render();
}

// Init
function init() {
  serverUrl = lsGet(LS_SERVER, '');
  if (serverUrl) document.getElementById('serverInput').value = serverUrl;
  links = lsGetJSON(LS_LINKS, []);
  if (!Array.isArray(links)) links = [];
  if (window._pendingClick) { recordClick(window._pendingClick); window._pendingClick = null; }
  render();
  document.getElementById('inName').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('inUrl').focus(); });
  document.getElementById('inUrl').addEventListener('keydown', function(e) { if (e.key === 'Enter') addLink(); });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Server URL
function saveServer() {
  var v = document.getElementById('serverInput').value.trim();
  if (!v) { toast('URL kiriting'); return; }
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  if (v.indexOf('redirect.html') === -1) {
    if (v.charAt(v.length - 1) !== '/') v += '/';
    v += 'redirect.html';
    document.getElementById('serverInput').value = v;
  }
  serverUrl = v;
  lsSet(LS_SERVER, v);
  links = links.map(function(l) { return Object.assign({}, l, { deeplink: buildDeepLink(l.id, getSchemes(l.url)) }); });
  saveLinks();
  render();
  toast('Saqlandi');
}

function getManagerUrl() {
  return location.origin + location.pathname;
}

// Parsers
function parseYouTube(url) {
  var pats = [/[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/(?:shorts|embed|live)\/([a-zA-Z0-9_-]{11})/];
  for (var i = 0; i < pats.length; i++) { var m = url.match(pats[i]); if (m) return m[1]; }
  return null;
}

function getSchemes(url) {
  var yt = parseYouTube(url);
  if (yt) return {
    appName: 'YouTube',
    ios: 'vnd.youtube://' + yt,
    android: 'intent://www.youtube.com/watch?v=' + yt + '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + yt) + ';end',
    fallback: 'https://www.youtube.com/watch?v=' + yt
  };

  if (/instagram\.com/.test(url)) {
    var path = url.replace(/https?:\/\/(?:www\.)?instagram\.com/, '').split('?')[0].replace(/\/$/, '');
    return {
      appName: 'Instagram',
      ios: 'instagram://www.instagram.com' + path,
      android: 'intent://www.instagram.com' + path + '#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=' + encodeURIComponent(url) + ';end',
      fallback: url
    };
  }

  var sp = url.match(/spotify\.com\/(track|album|playlist|artist|episode)\/([a-zA-Z0-9]+)/);
  if (sp) { var su = 'spotify:' + sp[1] + ':' + sp[2]; return { appName: 'Spotify', ios: su, android: su, fallback: url }; }

  var tg = url.match(/t\.me\/([a-zA-Z0-9_]+)/);
  if (tg) { var ts = 'tg://resolve?domain=' + tg[1]; return { appName: 'Telegram', ios: ts, android: ts, fallback: url }; }

  var tw = url.match(/(?:twitter|x)\.com\/([a-zA-Z0-9_]+)(?:\/status\/(\d+))?/);
  if (tw) { var tws = tw[2] ? 'twitter://status?id=' + tw[2] : 'twitter://user?screen_name=' + tw[1]; return { appName: 'Twitter/X', ios: tws, android: tws, fallback: url }; }

  var tt = url.match(/tiktok\.com\/@([^/]+)\/video\/(\d+)/);
  if (tt) { var tts = 'snssdk1233://aweme/detail/?id=' + tt[2]; return { appName: 'TikTok', ios: tts, android: tts, fallback: url }; }

  var rd = url.match(/reddit\.com(\/r\/[^?#]+)/);
  if (rd) return { appName: 'Reddit', ios: 'reddit://reddit.com' + rd[1], android: 'reddit://reddit.com' + rd[1], fallback: url };

  return { appName: 'Browser', ios: null, android: null, fallback: url };
}

function buildDeepLink(id, schemes) {
  if (!serverUrl) return '';
  var p = new URLSearchParams();
  if (schemes.ios) p.set('ios', schemes.ios);
  if (schemes.android) p.set('android', schemes.android);
  p.set('url', schemes.fallback);
  p.set('id', id);
  p.set('cb', getManagerUrl());
  return serverUrl + '?' + p.toString();
}

// Toggle
function toggleAdd() {
  addOpen = !addOpen;
  document.getElementById('addCard').style.display = addOpen ? 'block' : 'none';
  document.getElementById('addToggle').textContent = addOpen ? 'x Yopish' : '+ Yangi deep link qo\u2019shish';
  if (addOpen) setTimeout(function() { document.getElementById('inName').focus(); }, 50);
}

// Add
function addLink() {
  var name = document.getElementById('inName').value.trim();
  var url  = document.getElementById('inUrl').value.trim();
  var err  = document.getElementById('addErr');
  err.classList.remove('show');

  if (!name) { err.textContent = 'Nom kiriting.'; err.classList.add('show'); return; }
  if (!url)  { err.textContent = 'Havola kiriting.'; err.classList.add('show'); return; }
  if (!serverUrl) { err.textContent = 'Avval server URL ni saqlang.'; err.classList.add('show'); return; }

  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url); } catch(e) { err.textContent = "Noto'g'ri URL."; err.classList.add('show'); return; }

  var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  var schemes = getSchemes(url);
  var deeplink = buildDeepLink(id, schemes);

  links.unshift({ id: id, name: name, url: url, deeplink: deeplink, appName: schemes.appName, clicks: 0, created: Date.now() });
  saveLinks();
  render();

  document.getElementById('inName').value = '';
  document.getElementById('inUrl').value  = '';
  if (addOpen) toggleAdd();
  toast('Link qo\u2019shildi');
}

// Delete
function deleteLink(id) {
  if (!confirm('Bu linkni o\u2019chirasizmi?')) return;
  links = links.filter(function(l) { return l.id !== id; });
  saveLinks();
  render();
  toast("O'chirildi");
}

// Save
function saveLinks() { lsSet(LS_LINKS, links); }

// Copy
function copyFromCard(id) {
  var card = document.getElementById('lc-' + id);
  if (!card) return;
  var dl = card.getAttribute('data-dl');
  if (!dl) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(dl).then(function() { toast('Nusxa olindi'); }).catch(function() { fallbackCopy(dl); });
  } else {
    fallbackCopy(dl);
  }
}

function fallbackCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); toast('Nusxa olindi'); } catch(e) { toast('Qolda nusxa oling'); }
  document.body.removeChild(ta);
}

// Render
var ICONS = { YouTube: '\u25b6', Instagram: '\u25c6', Spotify: '\u25cf', Telegram: '\u2708', 'Twitter/X': '\u2726', TikTok: '\u25b8', Reddit: '\u25c8', Browser: '\u2295' };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  var wrap = document.getElementById('linksWrap');
  if (!links.length) {
    wrap.innerHTML = '<div class="empty">Hali hech qanday link yo\u02bcq.<br>Yuqoridagi "+" tugmani bosib qo\u02bcshish.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < links.length; i++) {
    var l = links[i];
    var icon = ICONS[l.appName] || '\u2295';
    var date = new Date(l.created).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    var lastClick = l.lastClick ? 'Oxirgi: ' + new Date(l.lastClick).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) : '';
    var dl = l.deeplink || '';
    var dlShort = dl.length > 70 ? dl.slice(0, 70) + '...' : dl;
    html += '<div class="link-card" id="lc-' + l.id + '" data-dl="' + esc(dl) + '">';
    html += '<div class="lc-top">';
    html += '<div class="lc-info"><div class="lc-name">' + esc(l.name) + '</div><div class="lc-meta">' + icon + ' ' + l.appName + ' &middot; ' + date + '</div></div>';
    html += '<div class="lc-actions">';
    html += '<button class="btn btn-ghost" onclick="copyFromCard(\'' + l.id + '\')">Nusxa</button>';
    html += '<button class="btn-danger" onclick="deleteLink(\'' + l.id + '\')">O\u02bcchir</button>';
    html += '</div></div>';
    html += '<div class="lc-deeplink" onclick="copyFromCard(\'' + l.id + '\')">' + esc(dlShort) + '</div>';
    html += '<div class="lc-stats"><span class="stat-num">' + (l.clicks || 0) + '</span><span class="stat-lbl">BOSISH</span>';
    if (lastClick) html += '<span class="stat-date">' + lastClick + '</span>';
    html += '</div></div>';
  }
  wrap.innerHTML = html;
}

// Toast
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2200);
}
</script>
</body>
</html>
