<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0f0e">
<title>DeepLink Manager — Ajib Studio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0e;--surface:#141716;--border:#222824;--green:#39ff7a;--green-dim:#1a7a3a;--text:#e8ede9;--muted:#5a6b5e;--error:#ff5252;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 80px}
.auth-wrap{width:100%;max-width:400px;margin-top:60px}
.auth-logo{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--green);opacity:0.6;margin-bottom:10px;text-align:center}
.auth-title{font-family:var(--mono);font-size:28px;font-weight:700;text-align:center;margin-bottom:32px}
.auth-title span{color:var(--green)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}
.field-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.12em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.field{margin-bottom:16px}
input[type=text],input[type=email],input[type=password],input[type=url]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:13px;padding:12px 14px;outline:none;transition:border-color 0.15s}
input:focus{border-color:var(--green-dim)}
input::placeholder{color:var(--muted)}
.btn{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:0.06em;padding:12px 18px;border-radius:7px;cursor:pointer;border:none;transition:opacity 0.15s;width:100%;margin-top:4px}
.btn-primary{background:var(--green);color:#0d0f0e}
.btn-primary:hover{opacity:0.85}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.btn-sm{width:auto;padding:8px 14px;font-size:11px}
.btn-danger-sm{background:transparent;border:1px solid transparent;color:var(--error);font-family:var(--mono);font-size:11px;font-weight:600;padding:8px 12px;border-radius:7px;cursor:pointer;opacity:0.55;transition:opacity 0.15s}
.btn-danger-sm:hover{opacity:1;border-color:var(--error)}
.err{font-family:var(--mono);font-size:11px;color:var(--error);margin-top:8px;display:none;text-align:center}
.err.show{display:block}
.app-wrap{display:none;width:100%;max-width:660px}
header{text-align:center;margin-bottom:28px;width:100%}
.logo{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--green);opacity:0.6;margin-bottom:8px}
h1{font-family:var(--mono);font-size:clamp(22px,4vw,32px);font-weight:700}
h1 span{color:var(--green)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.user-info{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em}
.server-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 16px;margin-bottom:16px}
.server-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.12em;white-space:nowrap;flex-shrink:0}
.server-bar input{flex:1;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:12px;color:var(--text);min-width:0}
.server-bar input::placeholder{color:var(--muted)}
.add-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:14px;display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.add-toggle{width:100%;background:transparent;border:1px dashed var(--border);border-radius:12px;padding:13px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;letter-spacing:0.06em;margin-bottom:18px;transition:all 0.15s;text-align:center}
.add-toggle:hover{border-color:var(--green-dim);color:var(--green)}
.links-wrap{display:flex;flex-direction:column;gap:10px}
.link-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.lc-info{flex:1;min-width:0}
.lc-name{font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-meta{font-family:var(--mono);font-size:10px;color:var(--muted)}
.lc-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.short-url{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--green-dim);border-radius:6px;padding:8px 12px;margin-bottom:8px}
.short-url-text{font-family:var(--mono);font-size:12px;color:var(--green);flex:1;word-break:break-all}
.short-copy{font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;white-space:nowrap;padding:2px 8px;border:1px solid var(--border);border-radius:4px;transition:all 0.15s;background:transparent}
.short-copy:hover{border-color:var(--green);color:var(--green)}
.lc-stats{display:flex;align-items:center;gap:16px;padding-top:10px;border-top:1px solid var(--border)}
.stat-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);line-height:1}
.stat-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;margin-left:5px}
.stat-date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.empty{text-align:center;padding:40px 24px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.06em;border:1px dashed var(--border);border-radius:12px}
.loading-wrap{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--green);color:#0d0f0e;font-family:var(--mono);font-size:12px;font-weight:700;padding:10px 20px;border-radius:6px;opacity:0;transition:all 0.2s;pointer-events:none;letter-spacing:0.06em;white-space:nowrap;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:500px){.row2{grid-template-columns:1fr}.lc-actions{flex-wrap:wrap}}
</style>
</head>
<body>

<div class="auth-wrap" id="authWrap">
  <div class="auth-logo">ajib studio</div>
  <div class="auth-title">Deep<span>Link</span></div>
  <div class="auth-card" id="loginCard">
    <div class="field">
      <div class="field-label"><span class="dot"></span> EMAIL</div>
      <input type="email" id="loginEmail" placeholder="email@gmail.com" autocomplete="email">
    </div>
    <div class="field">
      <div class="field-label"><span class="dot"></span> PAROL</div>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginErr" class="err"></div>
    <button class="btn btn-primary" onclick="doLogin()">Kirish</button>
  </div>
</div>

<div class="app-wrap" id="appWrap">
  <header>
    <div class="logo">ajib studio</div>
    <h1>Deep<span>Link</span> Manager</h1>
  </header>
  <div class="topbar">
    <div class="user-info" id="userInfo"></div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Chiqish</button>
  </div>
  <div class="server-bar" style="display:none">
    <span class="server-lbl">REDIRECT URL</span>
    <input type="url" id="serverInput" placeholder="https://ibrohimobid.github.io/DEEPLINK/redirect.html" autocomplete="off" spellcheck="false">
    <button class="btn btn-ghost btn-sm" onclick="saveServer()">Saqlash</button>
  </div>
  <div class="add-card" id="addCard">
    <div class="row2">
      <div>
        <div class="field-label"><span class="dot"></span> LINK NOMI</div>
        <input type="text" id="inName" placeholder="Masalan: Ajib Studio intro">
      </div>
      <div>
        <div class="field-label"><span class="dot"></span> MAQSAD HAVOLA</div>
        <input type="url" id="inUrl" placeholder="https://youtube.com/watch?v=...">
      </div>
    </div>
    <div id="addErr" class="err"></div>
    <button class="btn btn-primary" onclick="addLink()">+ Qo&#x2019;shish</button>
  </div>
  <button class="add-toggle" id="addToggle" onclick="toggleAdd()">+ Yangi deep link qo&#x2019;shish</button>
  <div class="links-wrap" id="linksWrap">
    <div class="loading-wrap"><div class="spinner"></div>Yuklanmoqda…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SUPA_URL = 'https://nznohbnenkylgwcfluca.supabase.co';
var SUPA_KEY = 'sb_publishable_CMKVeOihqR9eX1Zzqrx_Cg_ZCZbXZsd';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
var LS_SERVER = 'dl_server_v4';
var BASE_URL = 'https://ibrohimobid.github.io/DEEPLINK/r.html?c=';
var DEFAULT_SERVER = 'https://ibrohimobid.github.io/DEEPLINK/redirect.html';
var links = [];
var serverUrl = '';
var addOpen = false;
var currentUser = null;

function showErr(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block'; el.classList.add('show');
}

// Auth
async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass  = document.getElementById('loginPass').value;
  var err   = document.getElementById('loginErr');
  err.classList.remove('show'); err.style.display = 'none';
  if (!email || !pass) { showErr('loginErr','Email va parol kiriting.'); return; }
  var res = await sb.auth.signInWithPassword({ email:email, password:pass });
  if (res.error) { showErr('loginErr', res.error.message); }
}

async function doLogout() {
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange(function(event, session) {
  if (session && session.user) {
    currentUser = session.user;
    document.getElementById('authWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('userInfo').textContent = session.user.email;
    serverUrl = localStorage.getItem(LS_SERVER) || DEFAULT_SERVER;
    localStorage.setItem(LS_SERVER, serverUrl);
    document.getElementById('serverInput').value = serverUrl;
    loadLinks();
  } else {
    currentUser = null;
    document.getElementById('authWrap').style.display = 'block';
    document.getElementById('appWrap').style.display = 'none';
    links = [];
  }
});

// Load
async function loadLinks() {
  document.getElementById('linksWrap').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>Yuklanmoqda…</div>';
  var res = await sb.from('links').select('*').order('created', { ascending:false });
  links = res.error ? [] : (res.data || []);
  render();
}

// Server URL
function saveServer() {
  var v = document.getElementById('serverInput').value.trim();
  if (!v) { toast('URL kiriting'); return; }
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  if (v.indexOf('redirect.html') === -1) {
    if (v.charAt(v.length-1) !== '/') v += '/';
    v += 'redirect.html';
    document.getElementById('serverInput').value = v;
  }
  serverUrl = v;
  localStorage.setItem(LS_SERVER, v);
  toast('Saqlandi');
}

// Short code generator
function makeCode() {
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var code = '';
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

// Schemes
function parseYT(url) {
  var pats = [/[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/(?:shorts|embed|live)\/([a-zA-Z0-9_-]{11})/];
  for (var i=0;i<pats.length;i++){ var m=url.match(pats[i]); if(m) return m[1]; }
  return null;
}
function getSchemes(url) {
  var yt = parseYT(url);
  if (yt) return { appName:'YouTube', ios:'vnd.youtube://'+yt, android:'intent://www.youtube.com/watch?v='+yt+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent('https://www.youtube.com/watch?v='+yt)+';end', fallback:'https://www.youtube.com/watch?v='+yt };
  if (/instagram\.com/.test(url)) {
    var path=url.replace(/https?:\/\/(?:www\.)?instagram\.com/,'').split('?')[0].replace(/\/$/,'');
    return { appName:'Instagram', ios:'instagram://www.instagram.com'+path, android:'intent://www.instagram.com'+path+'#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url='+encodeURIComponent(url)+';end', fallback:url };
  }
  var sp=url.match(/spotify\.com\/(track|album|playlist|artist|episode)\/([a-zA-Z0-9]+)/);
  if (sp){ var su='spotify:'+sp[1]+':'+sp[2]; return { appName:'Spotify', ios:su, android:su, fallback:url }; }
  var tg=url.match(/t\.me\/([a-zA-Z0-9_]+)/);
  if (tg){ var ts='tg://resolve?domain='+tg[1]; return { appName:'Telegram', ios:ts, android:ts, fallback:url }; }
  var tw=url.match(/(?:twitter|x)\.com\/([a-zA-Z0-9_]+)(?:\/status\/(\d+))?/);
  if (tw){ var tws=tw[2]?'twitter://status?id='+tw[2]:'twitter://user?screen_name='+tw[1]; return { appName:'Twitter/X', ios:tws, android:tws, fallback:url }; }
  var tt=url.match(/tiktok\.com\/@([^/]+)\/video\/(\d+)/);
  if (tt){ var tts='snssdk1233://aweme/detail/?id='+tt[2]; return { appName:'TikTok', ios:tts, android:tts, fallback:url }; }
  var rd=url.match(/reddit\.com(\/r\/[^?#]+)/);
  if (rd) return { appName:'Reddit', ios:'reddit://reddit.com'+rd[1], android:'reddit://reddit.com'+rd[1], fallback:url };
  return { appName:'Browser', ios:null, android:null, fallback:url };
}
function buildDeepLink(id, schemes) {
  if (!serverUrl) return '';
  var p = new URLSearchParams();
  if (schemes.ios) p.set('ios', schemes.ios);
  if (schemes.android) p.set('android', schemes.android);
  p.set('url', schemes.fallback);
  p.set('id', id);
  return serverUrl + '?' + p.toString();
}

// Toggle
function toggleAdd() {
  addOpen = !addOpen;
  document.getElementById('addCard').style.display = addOpen ? 'block' : 'none';
  document.getElementById('addToggle').textContent = addOpen ? 'x Yopish' : '+ Yangi deep link qo\u2019shish';
  if (addOpen) setTimeout(function(){ document.getElementById('inName').focus(); }, 50);
}

// Add
async function addLink() {
  var name = document.getElementById('inName').value.trim();
  var url  = document.getElementById('inUrl').value.trim();
  var err  = document.getElementById('addErr');
  err.classList.remove('show'); err.style.display = 'none';
  if (!name) { showErr('addErr','Nom kiriting.'); return; }
  if (!url)  { showErr('addErr','Havola kiriting.'); return; }
  if (!serverUrl) { showErr('addErr','Avval server URL ni saqlang.'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  var id = Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  var code = makeCode();
  var schemes = getSchemes(url);
  var deeplink = buildDeepLink(id, schemes);
  var shortUrl = BASE_URL + code;

  var row = { id:id, user_id:currentUser.id, name:name, url:url, deeplink:deeplink, app_name:schemes.appName, clicks:0, last_click:null, created:Date.now(), short_code:code };
  var res = await sb.from('links').insert(row);
  if (res.error) { showErr('addErr', res.error.message); return; }

  links.unshift(row);
  render();
  document.getElementById('inName').value = '';
  document.getElementById('inUrl').value  = '';
  if (addOpen) toggleAdd();
  toast('Link qo\u2019shildi');
}

// Delete
async function deleteLink(id) {
  if (!confirm('O\u02bcchirasizmi?')) return;
  await sb.from('links').delete().eq('id', id);
  links = links.filter(function(l){ return l.id !== id; });
  render();
  toast('O\u02bcchirildi');
}

// Copy
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('Nusxa olindi'); }).catch(function(){ fbCopy(txt); });
  } else { fbCopy(txt); }
}
function fbCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); toast('Nusxa olindi'); } catch(e) { toast('Qolda nusxa oling'); }
  document.body.removeChild(ta);
}

// Render
var ICONS = { YouTube:'\u25b6', Instagram:'\u25c6', Spotify:'\u25cf', Telegram:'\u2708', 'Twitter/X':'\u2726', TikTok:'\u25b8', Reddit:'\u25c8', Browser:'\u2295' };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  var wrap = document.getElementById('linksWrap');
  if (!links.length) {
    wrap.innerHTML = '<div class="empty">Hali hech qanday link yo\u02bcq.<br>"+" tugmani bosib qo\u02bcshish.</div>';
    return;
  }
  var html = '';
  for (var i=0;i<links.length;i++) {
    var l = links[i];
    var icon = ICONS[l.app_name] || '\u2295';
    var date = new Date(l.created).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
    var lastClick = l.last_click ? 'Oxirgi: '+new Date(l.last_click).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) : '';
    var shortUrl = BASE_URL + (l.short_code || '');
    html += '<div class="link-card">';
    html += '<div class="lc-top">';
    html += '<div class="lc-info"><div class="lc-name">'+esc(l.name)+'</div><div class="lc-meta">'+icon+' '+l.app_name+' &middot; '+date+'</div></div>';
    html += '<div class="lc-actions">';
    html += '<button class="btn-danger-sm" onclick="deleteLink(\''+l.id+'\')">O\u02bcchir</button>';
    html += '</div></div>';
    html += '<div class="short-url">';
    html += '<span class="short-url-text">'+esc(shortUrl)+'</span>';
    html += '<button class="short-copy" onclick="copyText(\''+esc(shortUrl)+'\')">Nusxa</button>';
    html += '</div>';
    html += '<div class="lc-stats"><span class="stat-num">'+(l.clicks||0)+'</span><span class="stat-lbl">BOSISH</span>';
    if (lastClick) html += '<span class="stat-date">'+lastClick+'</span>';
    html += '</div></div>';
  }
  wrap.innerHTML = html;
}

// Toast
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

// Keys
document.addEventListener('keydown', function(e) {
  if (e.key==='Enter' && e.target.id==='loginEmail') document.getElementById('loginPass').focus();
  if (e.key==='Enter' && e.target.id==='loginPass') doLogin();
  if (e.key==='Enter' && e.target.id==='inName') document.getElementById('inUrl').focus();
  if (e.key==='Enter' && e.target.id==='inUrl') addLink();
});
</script>
</body>
</html>
